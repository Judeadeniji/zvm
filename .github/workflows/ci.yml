name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER="0.17.0"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   OS=linux;   ARCH=x86_64;  EXT=tar.xz ;;
            macOS-ARM64) OS=macos;   ARCH=aarch64; EXT=tar.xz ;;
            macOS-X64)   OS=macos;   ARCH=x86_64;  EXT=tar.xz ;;
            Windows-X64) OS=windows; ARCH=x86_64;  EXT=zip    ;;
            *) echo "Unsupported platform: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          NAME="zig-${OS}-${ARCH}-${ZIG_VER}"
          URL="https://ziglang.org/download/${ZIG_VER}/${NAME}.${EXT}"
          if [ "$EXT" = "zip" ]; then
            curl -fsSL "$URL" -o zig.zip
            7z x zig.zip -o. > /dev/null
          else
            curl -fsSL "$URL" | tar -xJ
          fi
          echo "$PWD/$NAME" >> "$GITHUB_PATH"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check src/

      - name: Build and run tests
        run: |
          zig build
          zig build test

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.17.0
        run: |
          curl -fsSL https://ziglang.org/download/0.17.0/zig-linux-x86_64-0.17.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.17.0" >> "$GITHUB_PATH"

      - name: Fetch Zig Minisign public key
        id: minisig
        run: |
          KEY=$(curl -fsSL https://ziglang.org/download/ | grep -oE 'RW[A-Za-z0-9+/=]{54}' | head -n 1)
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cross-compile standalone binary (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dminisig-key="${{ steps.minisig.outputs.key }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: zvm-${{ matrix.target }}
          path: zig-out/bin/
