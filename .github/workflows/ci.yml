name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.17.0
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   KEY="x86_64-linux"   ;;
            macOS-ARM64) KEY="aarch64-macos"  ;;
            macOS-X64)   KEY="x86_64-macos"   ;;
            Windows-X64) KEY="x86_64-windows" ;;
            *) echo "Unsupported platform: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          URL=$(curl -fsSL https://ziglang.org/download/index.json \
                | KEY="$KEY" python3 -c \
                  "import sys,json,os; print(json.load(sys.stdin)['0.17.0'][os.environ['KEY']]['tarball'])")
          if [[ "$URL" == *.zip ]]; then
            curl -fsSL "$URL" -o zig.zip
            7z x zig.zip -o. > /dev/null
            DIR=$(python3 -c "u='$URL'; print(u.rsplit('/',1)[-1].removesuffix('.zip'))")
          else
            curl -fsSL "$URL" | tar -xJ
            DIR=$(python3 -c "u='$URL'; print(u.rsplit('/',1)[-1].removesuffix('.tar.xz').removesuffix('.tar.gz'))")
          fi
          echo "$PWD/$DIR" >> "$GITHUB_PATH"

      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check src/

      - name: Build and run tests
        run: |
          zig build
          zig build test

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.17.0
        run: |
          URL=$(curl -fsSL https://ziglang.org/download/index.json \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['0.17.0']['x86_64-linux']['tarball'])")
          curl -fsSL "$URL" | tar -xJ
          DIR=$(python3 -c "u='$URL'; print(u.rsplit('/',1)[-1].removesuffix('.tar.xz').removesuffix('.tar.gz'))")
          echo "$PWD/$DIR" >> "$GITHUB_PATH"

      - name: Fetch Zig Minisign public key
        id: minisig
        run: |
          KEY=$(curl -fsSL https://ziglang.org/download/ | grep -oE 'RW[A-Za-z0-9+/=]{54}' | head -n 1)
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cross-compile standalone binary (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dminisig-key="${{ steps.minisig.outputs.key }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: zvm-${{ matrix.target }}
          path: zig-out/bin/
