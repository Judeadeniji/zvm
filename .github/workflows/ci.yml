name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check src/

      - name: Build and run tests
        run: |
          zig build
          zig build test

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
    steps:
      - uses: actions/checkout@v6

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Fetch Zig Minisign public key
        id: minisig
        run: |
          KEY=$(curl -fsSL https://ziglang.org/download/ | grep -oE 'RW[A-Za-z0-9+/=]{54}' | head -n 1)
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Cross-compile standalone binary (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dminisig-key="${{ steps.minisig.outputs.key }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: zvm-${{ matrix.target }}
          path: zig-out/bin/
