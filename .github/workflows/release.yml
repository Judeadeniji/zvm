name: Release

# Triggered two ways:
#  1. Push a tag manually:  git tag v0.2.0 && git push origin v0.2.0
#  2. GitHub UI / gh CLI:   gh workflow run release.yml -f version=v0.2.0
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # Only needed for manual dispatch — push trigger already has a tag.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate and create tag
        id: set
        run: |
          TAG="${{ inputs.version }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $TAG"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [tag]
    # Run after tag job (dispatch) OR directly on a tag push.
    if: always() && (needs.tag.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            archive: tar.gz
          - target: aarch64-linux
            archive: tar.gz
          - target: x86_64-macos
            archive: tar.gz
          - target: aarch64-macos
            archive: tar.gz
          - target: x86_64-windows
            archive: zip
    steps:
      - uses: actions/checkout@v6
        with:
          # For tag-push: github.ref is the tag. For dispatch: use the created tag.
          ref: ${{ github.event_name == 'push' && github.ref || needs.tag.outputs.tag }}

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Fetch Zig Minisign public key
        id: minisig
        run: |
          KEY=$(curl -fsSL https://ziglang.org/download/ | grep -oE 'RW[A-Za-z0-9+/=]{54}' | head -n 1)
          test -n "$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build release binary (${{ matrix.target }})
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dminisig-key="${{ steps.minisig.outputs.key }}"

      - name: Package release archive
        run: |
          TAG=${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          mkdir -p dist
          PKG="zvm-${TAG}-${{ matrix.target }}"
          mkdir -p "stage/$PKG"
          cp zig-out/bin/* "stage/$PKG/"
          cp LICENSE README.md "stage/$PKG/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd stage && zip -r "../dist/$PKG.zip" "$PKG")
          else
            tar -czf "dist/$PKG.tar.gz" -C stage "$PKG"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
